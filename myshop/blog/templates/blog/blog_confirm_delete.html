{% extends 'catalog/base.html' %}
{% load static %}

{% block title %}Удаление статьи{% endblock %}

{% block header %}Удаление статьи{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card">
            <div class="card-body text-center">
                <h3>Вы уверены, что хотите удалить статью?</h3>
                <p class="lead">{{ object.title }}</p>
                
                <form method="post">
                    {% csrf_token %}
                    <div class="d-grid gap-2">
                        <button type="submit" class="btn btn-danger">Да, удалить</button>
                        <a href="{% url 'blog:list' %}" class="btn btn-secondary">Отмена</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
